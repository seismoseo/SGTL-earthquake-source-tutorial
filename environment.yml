# SGTL earthquake source tutorial — course environment ("sgtl").
# Created by bin/sgtl-install (dry run by default). One environment for every module except PyFK,
# which needs its own Python 3.9 environment (envs/pyfk.yml).
# numpy stays below 2 because MTUQ and elastic_stress_py (via tectonic-utils) require it.
name: sgtl
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy=1.26.4
  - scipy
  - pandas
  - matplotlib-base
  - pyproj
  - cartopy
  - gmt=6.5
  - pygmt=0.13
  - obspy=1.4.2
  - h5py
  - netcdf4
  - xarray
  - pyyaml
  - requests
  - tqdm
  - threadpoolctl
  - scikit-fmm
  - plotly
  - cutde>=25.7
  # Jupyter and notebook tooling
  - jupyterlab=4.5
  - ipykernel
  - ipywidgets=8
  - ipympl
  - jupytext
  - nbformat
  - nbclient
  - nbmake
  - nbdime
  - papermill
  - pytest<9                     # nbmake 1.3.4 does not load under pytest 9
  # command-line tools used by the tutorial
  - git
  - gh
  - perl
  - tmux
  - make
  - c-compiler
  - fortran-compiler
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.6.0
      - seisbench==0.11.0
      - pyocto
      - seismostats==1.0.1
      - tectonic-utils==0.2.1
      - pyrocko
