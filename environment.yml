# SGTL earthquake source tutorial — course environment ("sgtl").
# Created by bin/sgtl-install (dry run by default). One environment for every module except PyFK,
# which needs its own Python 3.9 environment (envs/pyfk.yml).
# numpy stays below 2 because MTUQ and elastic_stress_py (via tectonic-utils) require it.
name: sgtl
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy=1.26.4
  - scipy
  - pandas
  - matplotlib-base
  - pyproj
  - cartopy
  - gmt=6.5
  - pygmt=0.13
  - obspy=1.4.2
  - h5py
  - netcdf4
  - xarray
  - pyyaml
  - requests
  - tqdm
  - threadpoolctl
  - scikit-fmm
  - plotly
  - cutde>=25.7
  # conda-forge PyTorch (CPU build): the pip wheel loads the system libstdc++ first and then clashes
  # with conda's C++ libraries ("CXXABI_1.3.15 not found" when matplotlib/obspy are imported after torch).
  # Use the OpenBLAS build (cpu_generic), not the MKL one (cpu_mkl): with MKL as the BLAS/LAPACK of every
  # package, GMT aborts in pygmt fig.plot(x=..., y=...) ("double free or corruption"). Keep OpenBLAS and
  # GNU OpenMP, as before PyTorch came from conda-forge.
  - pytorch=2.6.*=cpu_generic*
  - libblas=*=*openblas
  - _openmp_mutex=*=*_gnu
  # Jupyter and notebook tooling
  - jupyterlab=4.5
  - ipykernel
  - ipywidgets=8
  - ipympl
  - jupytext
  - nbformat
  - nbclient
  # No nbmake: nothing in the course uses it, and the only conda-forge build that accepts a current nbclient
  # (1.3.4) declares a wider range than its own wheel (pip check: "requires nbclient<0.7.0") and pulls pydantic 1.
  - nbdime
  - papermill
  - pytest<9                     # the course tests are validated with pytest 8; move to 9 together with them
  # command-line tools used by the tutorial
  - git
  - gh
  - perl
  - tmux
  - make
  - c-compiler
  - fortran-compiler
  - pip
  - pip:
      - seisbench==0.11.7         # 0.11.0 fails to load its models unless xdas is installed
      - pyocto
      - seismostats==1.0.1
      - tectonic-utils==0.2.1
      - pyrocko
