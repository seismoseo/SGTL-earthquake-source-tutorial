# SGTL earthquake source tutorial — PyFK worker environment ("sgtl-pyfk").
# PyFK (frequency-wavenumber synthetic seismograms) needs Python 3.9, so it lives in its own small
# environment (about 0.5 GB). It writes Green's functions to files that the main "sgtl" environment reads.
# Created by: bin/sgtl-install pyfk --apply   (component available from a later release; see install/README.md)
# pyfk 0.3.0 comes from its author's conda channel (ziyixi); everything else from conda-forge.
name: sgtl-pyfk
channels:
  - ziyixi
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pyfk=0.3.0
  - obspy=1.4.2
  - numpy=1.26.4
  - scipy
