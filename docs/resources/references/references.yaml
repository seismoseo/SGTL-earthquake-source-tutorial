# Verified references for the SGTL earthquake source tutorial.
# One entry per work. Module headers cite entries by `key` (e.g. references: [shearer2019]; reading: ["shearer2019:ch1"]).
# status: V  = title, authors, year and venue checked on 2026-11-15 (Crossref, DataCite, or a publisher or catalog page)
#         V* = checked, but Crossref lists only the first author; co-authors are from standard citations
#         P  = the work exists, but some details are not confirmed (see note)
#         U  = could not be confirmed; do not rely on it without checking
# used_in: module ids (M00 ... M60), "project" (the research project) or "docs" (the AI-use policy and teaching notes).
# Edit this file by hand; then run tools/render_docs.py --apply to rebuild docs/reading_list.md.

