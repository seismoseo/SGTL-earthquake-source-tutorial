    title: Six Sangju earthquakes, 2018-2022
    sequence: sangju2019
    use: module
    large: false
    networks: [KS, KG]
    station_radius_km: 100
    window_s: [-30, 470]
    bands: [HH, HG, EL]
    expected: {stations: 152, basis: test fetch, files_per_event: {HH: [48, 110], HG: [105, 312], EL: [18, 39]}}
