# Waveform datasets that you fetch from STP with your own account.
# No waveforms are stored in this repository:
#   sgtl data list                   every dataset, its size, and what you already have
#   sgtl data fetch NAME             the plan (a dry run: nothing is downloaded)
#   sgtl data fetch NAME --apply     download into ~/sgtl/data/NAME/ (or $SGTL_DATA/NAME/)
#   sgtl data verify NAME            check the files you have against "expected" below
#
# Every event value below is copied from data/catalogs/kma_catalog.csv (times in UTC).
#   sequence:          the named space-time box in data/manifests/sequences.yaml that the events
#                      come from (null: none)
#   use:               module (small, used in the course modules) or project (for your research project)
#   large:             true for a dataset of several gigabytes; fetching it also needs --large
#   networks:          network codes to request (KS = KMA, KG = KIGAM)
#   station_radius_km: request every station whose distance from the dataset's center is at most this
#                      value; the center is the mean latitude and the mean longitude of the events
#   window_s:          [start, end] of each record in seconds relative to the event's origin time
#   bands:             sensor bands to request: HH (broadband seismometer), HG (accelerometer) and
#                      EL (short-period seismometer); a station gives three files per band (E, N, Z)
#   expected:          what a complete download looks like; sgtl data verify compares with it
#     stations:        stations within station_radius_km in STP's station list (its "sta" command)
#                      on 2026-11-15
#     basis:           "test fetch" = counted on a real download on 2026-11-15; "estimate" = the
#                      station count times the share of stations with each band in the test fetches
#     files_per_event: allowed range [min, max] of SAC files per event, for each band: 0.7 x the
#                      smallest and 1.3 x the largest count of the test fetch (or of the estimate).
#                      The project dataset starts in 2002, when far fewer stations recorded, so it
#                      only has [0, 3 x stations]
# mb_per_request and requests_per_second come from the same test fetches: 373 MB in 2736 requests
# (Sangju, 279 s) and 307 MB in 2088 requests (Suncheon 2019, 116 s), records of 500 s; the plan scales the
# size with the record length (sangju2019_hours, records of 10800 s: 104 MB in 68 requests, 23 s, on
# 2026-11-19; gokseong2018: 358 MB in 2772 requests, 326 s, 2026-11-19). One request = one station and one
# band. STP is slower when it is busy.
schema_version: 1
status: active
catalog: data/catalogs/kma_catalog.csv
mb_per_request: 0.14
requests_per_second: 10
datasets:
